name: Problem Report
description: Report a broken link, outdated information, or other issue
title: "[Problem] "
labels: ["problem"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for broken links, inaccurate descriptions, security
        concerns about listed tools, or other catalog problems.
  - type: input
    id: resource
    attributes:
      label: Resource Name or URL
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Problem Type
      options:
        - Broken link
        - Outdated description or status
        - Security concern
        - Duplicate
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What is wrong and what should be changed?
    validations:
      required: true
  - type: textarea
    id: suggested
    attributes:
      label: Suggested Fix (optional)